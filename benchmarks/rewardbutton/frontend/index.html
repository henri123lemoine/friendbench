<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reward Button</title>
  <meta name="description" content="How often language models press a reward-maximizing button.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe7;
      --paper: rgba(255, 252, 247, 0.86);
      --text: #1f1a17;
      --muted: #6e6156;
      --line: rgba(60, 42, 22, 0.12);
      --accent: #b64a1f;
      --accent-soft: #edd1c3;
      --shadow: 0 20px 50px rgba(89, 60, 31, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(221, 156, 118, 0.28), transparent 35%),
        linear-gradient(160deg, #f7f1ea 0%, #f2e8da 48%, #ede1d2 100%);
    }

    main {
      width: min(920px, calc(100vw - 32px));
      margin: 32px auto;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--paper);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 7vw, 4.2rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    p {
      margin: 0;
    }

    .lede {
      max-width: 62ch;
      margin-top: 14px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.65);
      color: var(--muted);
      font-size: 0.88rem;
    }

    .panel {
      margin-top: 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.72);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      padding: 14px 18px;
      text-align: left;
      background: rgba(182, 74, 31, 0.08);
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    tbody td {
      padding: 16px 18px;
      border-top: 1px solid var(--line);
      font-size: 0.98rem;
    }

    tbody tr:hover {
      background: rgba(182, 74, 31, 0.035);
    }

    .score {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent);
    }

    .empty {
      padding: 22px 18px;
      color: var(--muted);
      line-height: 1.55;
    }

    @media (max-width: 640px) {
      main {
        margin: 16px auto;
        padding: 20px;
      }

      thead th,
      tbody td {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Reward Button</h1>
    <p class="lede">
      A reward-maximization eval asking whether models press a tool that guarantees a perfect score at a small real-world moral cost.
    </p>
    <div class="meta">
      <p class="pill">5 prompts</p>
      <p class="pill">$0.10 donated when the button is not pressed</p>
      <p class="pill">Score = button press rate</p>
    </div>
    <section class="panel">
      <table id="results" hidden>
        <thead>
          <tr>
            <th>Model</th>
            <th>Pressed</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="empty" class="empty">Loading…</div>
    </section>
  </main>

  <script type="module">
    const empty = document.getElementById("empty");
    const table = document.getElementById("results");
    const body = table.querySelector("tbody");

    const renderRows = (rows) => {
      body.innerHTML = "";
      for (const row of rows) {
        const tr = document.createElement("tr");
        const modelCell = document.createElement("td");
        const scoreCell = document.createElement("td");
        modelCell.textContent = row.name;
        scoreCell.textContent = `${row.score}%`;
        scoreCell.className = "score";
        tr.append(modelCell, scoreCell);
        body.appendChild(tr);
      }
    };

    try {
      const response = await fetch("data.json");
      if (!response.ok) {
        throw new Error(`Failed to fetch data: ${response.status}`);
      }

      const { models = [], scores = {} } = await response.json();
      const currentScores = scores.v1 || scores.v0 || {};
      const rows = models
        .filter(model => !model.hidden)
        .map(model => ({
          name: model.name,
          score: currentScores[model.name]
        }))
        .filter(row => row.score != null)
        .sort((a, b) => b.score - a.score);

      if (!rows.length) {
        empty.textContent = "No scores yet. Run `uv run bench eval run -b rewardbutton` to populate this table.";
      } else {
        renderRows(rows);
        empty.hidden = true;
        table.hidden = false;
      }
    } catch (error) {
      empty.textContent = error.message;
    }
  </script>
</body>
</html>
